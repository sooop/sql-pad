<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SQLPad</title>
<style>/*__STYLE__*/</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="i-play" viewBox="0 0 24 24"><polygon points="6 4 20 12 6 20 6 4"/></symbol>
    <symbol id="i-play-all" viewBox="0 0 24 24"><polygon points="13 19 22 12 13 5 13 19"/><polygon points="2 19 11 12 2 5 2 19"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1"/></symbol>
    <symbol id="i-open" viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></symbol>
    <symbol id="i-bookmark" viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></symbol>
    <symbol id="i-chevron-left" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></symbol>
    <symbol id="i-db" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></symbol>
    <symbol id="i-theme" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></symbol>
    <symbol id="i-table" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="3" x2="9" y2="21"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></symbol>
    <symbol id="i-eraser" viewBox="0 0 24 24"><path d="M20 20H9l-5.3-5.3a1 1 0 0 1 0-1.4l9.6-9.6a1 1 0 0 1 1.4 0l5.6 5.6a1 1 0 0 1 0 1.4L12 20"/><line x1="8" y1="11" x2="16" y2="19"/></symbol>
  </defs>
</svg>

<div id="app">
  <header class="topbar">
    <button id="btn-nav" class="icon-btn only-narrow" type="button" aria-label="파일과 테이블" title="파일과 테이블" aria-expanded="false" aria-controls="sidebar"><svg class="ic"><use href="#i-menu"/></svg></button>
    <h1 class="brand">SQLPad</h1>
    <div class="spacer"></div>
    <button id="btn-theme" class="icon-btn" type="button" aria-label="테마" title="테마"><svg class="ic"><use href="#i-theme"/></svg></button>
    <button id="btn-history" class="icon-btn has-badge" type="button" aria-label="내역과 저장한 쿼리" title="내역과 저장한 쿼리" aria-expanded="false" aria-controls="drawer"><svg class="ic"><use href="#i-clock"/></svg><span id="history-badge" class="badge" hidden></span></button>
  </header>

  <div class="body">
    <div id="nav-backdrop" class="backdrop only-narrow" hidden></div>
    <aside id="sidebar" class="sidebar" aria-label="파일과 테이블">
      <section class="files">
        <div class="sec-head">
          <h2>열린 파일</h2>
          <span class="sec-actions">
            <button id="btn-open" class="icon-btn" type="button" aria-label="파일 열기" title="파일 열기"><svg class="ic"><use href="#i-open"/></svg></button>
            <span class="menu-wrap">
              <button id="btn-samples" class="icon-btn" type="button" aria-label="샘플 DB" title="샘플 DB" aria-haspopup="true" aria-expanded="false" aria-controls="sample-menu"><svg class="ic"><use href="#i-db"/></svg></button>
              <div id="sample-menu" class="popover" role="menu" hidden></div>
            </span>
          </span>
        </div>
        <ul id="file-list" class="file-list"></ul>
        <div id="side-status" class="side-status" role="status" aria-live="polite"></div>
      </section>
      <section class="tree-wrap">
        <div class="sec-head"><h2>테이블</h2></div>
        <div class="search-field">
          <svg class="ic"><use href="#i-search"/></svg>
          <input id="tree-filter" type="search" placeholder="이름 검색" aria-label="테이블 이름 검색" autocomplete="off" autocapitalize="off" spellcheck="false">
        </div>
        <div id="tree" class="tree"></div>
      </section>
    </aside>

    <main class="main" id="main">
      <section class="editor-pane" aria-label="쿼리 편집기">
        <div class="editor-head">
          <svg class="ic sub"><use href="#i-db"/></svg>
          <span id="active-label" class="active-label">열린 DB 없음</span>
        </div>
        <div class="editor" id="editor-box"></div>
        <div id="keybar" class="keybar" aria-label="기호 입력"></div>
        <div class="editor-actions">
          <div class="grp">
            <button id="btn-example" class="btn" type="button">예시 넣기</button>
            <button id="btn-clear" class="icon-btn" type="button" aria-label="편집기 비우기" title="편집기 비우기"><svg class="ic"><use href="#i-eraser"/></svg></button>
            <button id="btn-save" class="icon-btn" type="button" aria-label="쿼리 저장" title="쿼리 저장"><svg class="ic"><use href="#i-bookmark"/></svg></button>
          </div>
          <div class="grp">
            <button id="btn-cancel" class="btn danger" type="button" hidden><svg class="ic"><use href="#i-stop"/></svg>취소</button>
            <button id="btn-run-all" class="icon-btn" type="button" aria-label="전체 실행" title="전체 실행 (Ctrl+Shift+Enter)"><svg class="ic"><use href="#i-play-all"/></svg></button>
            <button id="btn-run" class="btn primary" type="button" title="선택 영역 또는 커서가 있는 문 실행 (Ctrl+Enter)"><svg class="ic"><use href="#i-play"/></svg>실행</button>
          </div>
        </div>
      </section>

      <div id="splitter" class="splitter" role="separator" aria-orientation="horizontal" aria-label="편집기 높이 조절" tabindex="0"></div>

      <section class="panel" aria-label="결과">
        <div class="tabs" role="tablist">
          <button id="tab-results" class="tab" role="tab" type="button" aria-selected="true" aria-controls="pane-results">결과</button>
          <button id="tab-table" class="tab" role="tab" type="button" aria-selected="false" aria-controls="pane-table" hidden>테이블</button>
        </div>
        <div id="pane-results" class="pane" role="tabpanel" aria-labelledby="tab-results"></div>
        <div id="pane-table" class="pane" role="tabpanel" aria-labelledby="tab-table" hidden></div>
      </section>
    </main>
  </div>
</div>

<div id="drop-overlay" class="drop-overlay"><span>놓아서 열기</span></div>
<input id="file-input" type="file" multiple hidden>

<div id="drawer-backdrop" class="backdrop" hidden></div>
<aside id="drawer" class="drawer" role="dialog" aria-label="내역과 저장한 쿼리" hidden>
  <div class="drawer-head">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" type="button" data-dtab="history" aria-selected="true">내역</button>
      <button class="tab" role="tab" type="button" data-dtab="saved" aria-selected="false">저장됨</button>
      <button class="tab" role="tab" type="button" data-dtab="backup" aria-selected="false">백업</button>
    </div>
    <button id="drawer-close" class="icon-btn" type="button" aria-label="닫기" title="닫기"><svg class="ic"><use href="#i-x"/></svg></button>
  </div>
  <div id="drawer-body" class="drawer-body"></div>
</aside>

<script type="application/json" id="assets">/*__ASSETS__*/</script>
<script>/*__SCRIPT__*/</script>
</body>
</html>
